name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore
          ls -lh $GITHUB_WORKSPACE/release.keystore

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          KEYSTORE_FILE=../release.keystore
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
          sed 's/KEYSTORE_PASSWORD=.*/KEYSTORE_PASSWORD=***/; s/KEY_PASSWORD=.*/KEY_PASSWORD=***/' local.properties

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk --locked
          fi

      - name: Detect NDK
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)
          else
            NDK=$ANDROID_NDK_LATEST_HOME
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK" >> $GITHUB_ENV

      - name: Create jniLibs dirs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

      - name: Build arm64-v8a (API 24)
        run: |
          cargo ndk -t arm64-v8a --platform 24 \
            -o ./app/src/main/jniLibs \
            build --release

      - name: Build armeabi-v7a (API 21)
        run: |
          cargo ndk -t armeabi-v7a --platform 21 \
            -o ./app/src/main/jniLibs \
            build --release

      - name: Build release APKs
        run: gradle assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/universal/release/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/arm64/release/*.apk     out/ 2>/dev/null || true
          cp app/build/outputs/apk/arm32/release/*.apk     out/ 2>/dev/null || true
          ls -lh out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error
