name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- Java ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- Gradle (系统版，不用 gradlew) ----------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'   # 根据 gradle/wrapper 里的版本调整

      # ---------- Rust ----------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk --locked
          fi

      # ---------- 检测 NDK ----------
      - name: Detect NDK
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)
          else
            NDK=$ANDROID_NDK_LATEST_HOME
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "Using NDK: $NDK"

      # ---------- 编译 Rust 原生库 ----------
      - name: Create jniLibs dirs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

      - name: Build arm64-v8a (API 24)
        run: |
          cargo ndk -t arm64-v8a --platform 24 \
            -o ./app/src/main/jniLibs \
            build --release

      - name: Build armeabi-v7a (API 21)
        run: |
          cargo ndk -t armeabi-v7a --platform 21 \
            -o ./app/src/main/jniLibs \
            build --release

      # ---------- 打包 APK ----------
      - name: Build release APKs
        run: gradle assembleRelease --no-daemon

      # ---------- 收集产物 ----------
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/universal/release/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/arm64/release/*.apk     out/ 2>/dev/null || true
          cp app/build/outputs/apk/arm32/release/*.apk     out/ 2>/dev/null || true
          ls -lh out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error
